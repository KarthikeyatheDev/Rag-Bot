services:

  backend:
    build:
      context: ./backend
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app/data
      - chroma_data:/app/chroma_db
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: rag_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
  sqlite_data:
  chroma_data: